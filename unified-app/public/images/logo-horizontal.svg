<?xml version="1.0" encoding="UTF-8"?>
<svg width="280" height="60" viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon Background with Glow -->
  <rect x="3" y="3" width="54" height="54" rx="27" fill="url(#iconGradient)" filter="url(#glow)"/>
  
  <!-- Document -->
  <rect x="15" y="15" width="18" height="22" rx="3" fill="white" opacity="0.95"/>
  <rect x="18" y="19" width="8" height="1.5" rx="0.75" fill="#3b82f6"/>
  <rect x="18" y="22" width="12" height="1.5" rx="0.75" fill="#3b82f6"/>
  <rect x="18" y="25" width="10" height="1.5" rx="0.75" fill="#3b82f6"/>
  <rect x="18" y="28" width="6" height="1.5" rx="0.75" fill="#3b82f6"/>
  <rect x="18" y="31" width="9" height="1.5" rx="0.75" fill="#3b82f6"/>
  
  <!-- AI Elements with Glow -->
  <circle cx="35" cy="22" r="1.8" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="39" cy="27" r="1.2" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="32" cy="35" r="1.2" fill="#60a5fa" filter="url(#glow)"/>
  
  <!-- Main Text -->
  <text x="68" y="25" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="url(#textGradient)" filter="url(#glow)">
    GeraDocumentos
  </text>
  <text x="68" y="40" font-family="Roboto, Arial, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">
    com inteligência artificial
  </text>
  <text x="68" y="52" font-family="Roboto, Arial, sans-serif" font-size="9" font-weight="400" fill="#3b82f6">
    .com.br
  </text>
</svg>
